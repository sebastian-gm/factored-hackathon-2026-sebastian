# Sebastian-selected NLU/phrasing route. LLM_PROVIDER=mock still uses the mock
# nlu/phrase entries; a lead-enabled openai_compat deployment uses `default`.
routing:
  fallback_route: fallback_grok_4_20  # Only after the selected Gemini route fails.
models:
  nlu: {provider: mock, model_id: deterministic-b1}
  phrase: {provider: mock, model_id: deterministic-template}
  default: {provider: openai_compat, model_id: google/gemini-3-flash-preview, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: gemini-3-flash-preview, provider_only: [google-vertex/global], max_output_tokens: 2048}
  fallback_grok_4_20: {provider: openai_compat, model_id: x-ai/grok-4.20, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: grok-4.20, provider_only: [xai/zdr], max_output_tokens: 2048}
  fallback_deepseek_v4_flash: {provider: openai_compat, model_id: deepseek/deepseek-v4-flash-0731, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: deepseek-v4-flash-0731, provider_only: [wafer/fast], reasoning_effort: 'none', timeout_seconds: 45}
  gemini_flash_lite: {provider: gemini, model_id: gemini-2.5-flash-lite, key_env: GEMINI_API_KEY, output_mode: json_schema, price_id: gemini-2.5-flash-lite}
  gemini_flash: {provider: gemini, model_id: gemini-2.5-flash, key_env: GEMINI_API_KEY, output_mode: json_schema, price_id: gemini-2.5-flash}
  openrouter_gemini_lite: {provider: openai_compat, model_id: google/gemini-2.5-flash-lite, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: gemini-2.5-flash-lite}
  openrouter_deepseek: {provider: openai_compat, model_id: deepseek/deepseek-v3.2, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: deepseek-v3.2}
  openrouter_qwen: {provider: openai_compat, model_id: qwen/qwen3.5-flash-02-23, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: qwen3.5-flash-02-23}
  openrouter_grok: {provider: openai_compat, model_id: x-ai/grok-4.3, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: grok-4.3}
  openrouter_haiku: {provider: openai_compat, model_id: anthropic/claude-haiku-4.5, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: claude-haiku-4.5}
  openrouter_sonnet: {provider: openai_compat, model_id: anthropic/claude-sonnet-5, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: claude-sonnet-5, provider_only: [google-vertex/global], max_output_tokens: 2048}
  openrouter_opus: {provider: openai_compat, model_id: anthropic/claude-opus-5, base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, output_mode: json_schema, price_id: claude-opus-5}
  direct_deepseek: {provider: openai_compat, model_id: deepseek-chat, base_url: https://api.deepseek.com, key_env: DEEPSEEK_API_KEY, output_mode: json_mode}
  direct_xai: {provider: openai_compat, model_id: grok-4.3, base_url: https://api.x.ai/v1, key_env: XAI_API_KEY, output_mode: json_schema, price_id: grok-4.3}
  direct_qwen: {provider: openai_compat, model_id: qwen3.5-flash, base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1, key_env: DASHSCOPE_API_KEY, output_mode: json_mode}
  direct_haiku: {provider: anthropic, model_id: claude-haiku-4-5, key_env: ANTHROPIC_API_KEY, output_mode: json_schema, price_id: claude-haiku-4.5}
  direct_sonnet: {provider: anthropic, model_id: claude-sonnet-5, key_env: ANTHROPIC_API_KEY, output_mode: json_schema, price_id: claude-sonnet-5}
  direct_opus: {provider: anthropic, model_id: claude-opus-5, key_env: ANTHROPIC_API_KEY, output_mode: json_schema, price_id: claude-opus-5}
