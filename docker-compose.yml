name: ${COMPOSE_PROJECT_NAME:-bank-agent-lab}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "aclara.ops.migrate", "--app-role", "aclara_app"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      OPS_APP_PASSWORD: ${OPS_APP_PASSWORD:?Run python -m scripts.local_ops first}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: aclara_app
      PGPASSWORD: ${OPS_APP_PASSWORD:?Run python -m scripts.local_ops first}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DEMO_USERNAME: ${DEMO_USERNAME:?Set DEMO_USERNAME in .env}
      DEMO_ROLE: ${DEMO_ROLE:-customer}
      DEMO_LOCALE: ${DEMO_LOCALE:-es-MX}
      ALLOW_DEMO_RESET: ${ALLOW_DEMO_RESET:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      OPS_BACKEND: postgres
      AGENT_SYSTEM: P
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      BANK_CLOCK: ${BANK_CLOCK:-2026-06-18T06:00:00Z}
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
