[extend]
useDefault = true

# Audited metadata/test inputs only. Keep all default secret rules enabled.
[[rules]]
id = "hashicorp-tf-password"
[[rules.allowlists]]
description = "Judge environment variable refers to a Key Vault secret NAME"
condition = "AND"
paths = ['(?:^|/)infra/apps\.tf$']
regexTarget = "secret"
regexes = ['^"judge-password"$']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact authored durable claim replay key in this test"
condition = "AND"
paths = ['(?:^|/)tests/test_operational_store\.py$']
regexTarget = "secret"
regexes = ['^durable_claim_01$']

[[rules.allowlists]]
description = "Exact authored claim/resolve replay keys in this test"
condition = "AND"
paths = ['(?:^|/)tests/test_staff_api\.py$']
regexTarget = "secret"
regexes = ['^claim_fixture_01$', '^resolve_fixture_01$']

[[rules.allowlists]]
description = "Exact authored judge claim replay markers, never credentials"
condition = "AND"
paths = ['(?:^|/)tests/test_judge_staff_queue\.py$']
regexTarget = "secret"
regexes = ['^judge_self_claim_001$', '^revoked_claim_001$']

[[rules.allowlists]]
description = "The fixture evidence's single release-commit SHA field"
condition = "AND"
paths = ['(?:^|/)apps/web/fixtures/live-story-evidence\.json$']
regexTarget = "line"
regexes = ["^\\s*\"api_release_sha\": \"c32fd6429281a764ee33dd96622f237c7c0289c3\",?\\s*$"]

[[rules.allowlists]]
description = "Exact audited v0.9.1 auth source hashes used by the receipt verifier"
condition = "AND"
paths = ['(?:^|/)docs/evaluation/live_exploration_controls\.py$']
regexTarget = "secret"
regexes = [
  '^411f14672ed19d55682dd5311fc4a7281b26ff68cad3a13bac1d7bd8f3a83be1$',
  '^8ecde7737cec64202bfb1e6871026f43811214d8d0dd24f52e55eb5b23b824ac$',
]
