[project]
name = "aclara-bank-agent-lab"
version = "0.1.0"
description = "Synthetic ES/PT dispute-intake demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "babel>=2.17,<3",
  "lightgbm>=4.6,<5",
  "numpy>=2.2,<3",
  "rapidfuzz>=3.14,<4",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "pandera[polars]>=0.26,<1",
  "polars>=1.30,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
data-ml = [
  "dbt-core>=1.10,<2",
  "dbt-duckdb==1.11.0",
  "lightgbm>=4.6,<5",
  "matplotlib>=3.10,<4",
  "mlflow-skinny>=3.1,<4",
  "optuna>=4.5,<5",
  "rapidfuzz>=3.14,<4",
  "scikit-learn>=1.7,<2",
]
llm = [
  "anthropic>=0.75,<1",
  "google-genai>=1.0,<2",
  "typesafe-sdk>=0.7.2",
]
dev = [
  "pytz>=2026,<2027",
  "jsonschema>=4.26,<5",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "numpy>=2.2,<3",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aclara*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "T20", "SIM"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# This pipeline constructs SQL only from checked-in contracts and allowlisted table/column names.
# These subprocess calls invoke fixed git subcommands with an explicit repository path and no shell.
"scripts/check_staged_files.py" = ["S603", "S607"]
"src/aclara/data/pipeline.py" = ["S603", "S607", "S608"]
# FastAPI uses Depends(...) defaults as dependency declarations.
"src/aclara/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["aclara"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlflow.*", "optuna.*", "rapidfuzz.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
