name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy --strict src/aclara
      - name: Compile Python
        run: uv run python -m compileall -q src evals scripts
      - name: Run Python tests
        run: uv run pytest
      - name: Check frozen interface snapshots
        run: uv run python -m scripts.export_interfaces --check
      - name: Safety smoke
        run: uv run python -m evals.runner --system B1
      - name: Reactive evaluation
        run: uv run python -m evals.runner --system B1 --scenarios evals/dev_scenarios_v2.yaml
      - name: Staged-file policy
        run: uv run python scripts/check_staged_files.py --working-tree

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Build
        working-directory: apps/web
        run: pnpm build
