name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy --strict src/aclara
      - name: Compile Python
        run: uv run python -m compileall -q src evals scripts
      - name: Run Python tests
        run: uv run pytest
      - name: Check frozen interface snapshots
        run: uv run python -m scripts.export_interfaces --check
      - name: Check policy catalog
        run: uv run python -m scripts.generate_policy_catalog --check
      - name: Safety smoke
        run: uv run python -m evals.runner --system B1
      - name: Reactive evaluation
        run: uv run python -m evals.runner --system B1 --scenarios evals/dev_scenarios_v2.yaml
      - name: Staged-file policy
        run: uv run python scripts/check_staged_files.py --working-tree

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Build
        working-directory: apps/web
        run: pnpm build
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install live browser test API
        run: |
          python -m pip install uv==0.11.2
          uv sync --extra dev
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser stories and live customer/staff flows
        working-directory: apps/web
        run: |
          pnpm test:e2e
          pnpm test:e2e --live
          pnpm test:e2e --staff
          pnpm test:e2e --judge-roles

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.2
      - run: uv sync --extra dev --extra data-ml
      - name: Test migrations, RLS, restart, audit integrity and serving load
        env:
          TEST_POSTGRES_ADMIN_DSN: host=127.0.0.1 port=15432 user=postgres dbname=postgres
        run: uv run --no-sync python -m scripts.test_postgres
