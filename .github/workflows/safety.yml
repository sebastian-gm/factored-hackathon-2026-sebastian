name: safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run B1 safety scenarios with mock provider
        env:
          LLM_PROVIDER: mock
        run: uv run python -m evals.runner --system B1
      - name: Reject data files, private keys, and oversized tracked files
        run: uv run python scripts/check_staged_files.py --working-tree
