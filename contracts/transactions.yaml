contract_version: 1.0.0
table: transactions
primary_key: [transaction_id]
unknown_columns: warn_and_exclude_from_silver
missing_required_columns: fail_partition
columns:
  transaction_id: {type: string, nullable: false, pii: quasi_identifier, llm_exposure: never}
  transaction_date: {type: timestamp, nullable: false, pii: quasi_identifier, llm_exposure: masked}
  process_date: {type: date, nullable: false, pii: none, llm_exposure: never}
  product_id: {type: string, nullable: false, pii: quasi_identifier, llm_exposure: never}
  customer_id: {type: string, nullable: false, pii: quasi_identifier, llm_exposure: never}
  transaction_type: {type: string, nullable: false, pii: none, llm_exposure: masked}
  transaction_category: {type: string, nullable: true, pii: none, llm_exposure: masked}
  amount: {type: number, nullable: false, pii: sensitive, llm_exposure: masked, min: 0}
  currency: {type: string, nullable: false, pii: none, llm_exposure: masked}
  amount_usd: {type: number, nullable: true, pii: sensitive, llm_exposure: never}
  channel: {type: string, nullable: false, pii: none, llm_exposure: never}
  branch_id: {type: string, nullable: true, pii: quasi_identifier, llm_exposure: never}
  merchant_name: {type: string, nullable: true, pii: none, llm_exposure: masked}
  merchant_category: {type: string, nullable: true, pii: none, llm_exposure: masked}
  transaction_country: {type: string, nullable: false, pii: quasi_identifier, llm_exposure: masked}
  transaction_city: {type: string, nullable: true, pii: quasi_identifier, llm_exposure: never}
  transaction_status: {type: string, nullable: false, pii: none, llm_exposure: masked}
  response_code: {type: string, nullable: true, pii: none, llm_exposure: never}
  is_fraud: {type: boolean, nullable: false, pii: sensitive, llm_exposure: never}
  fraud_score: {type: number, nullable: true, pii: sensitive, llm_exposure: never, min: 0, max: 100}
  latitude: {type: number, nullable: true, pii: quasi_identifier, llm_exposure: never}
  longitude: {type: number, nullable: true, pii: quasi_identifier, llm_exposure: never}
normalization:
  transaction_country:
    México: MX
    Mexico: MX
    Colombia: CO
    Argentina: AR
    Brasil: BR
    Brazil: BR
    España: ES
    Spain: ES
    "Estados Unidos": US
    "United States": US
    USA: US
