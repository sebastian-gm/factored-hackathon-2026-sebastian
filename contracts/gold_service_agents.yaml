    - Active
    - Vacation
    - Leave
    - Inactive
  _dataset_version:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
  _source_file:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
  _source_sha256:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
  _ingested_at:
    type: timestamp
    nullable: false
    pii: none
    llm_exposure: never
  _pipeline_version:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
