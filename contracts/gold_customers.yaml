contract_version: 1.0.0
table: customers
layer: gold
primary_key:
- customer_id
columns:
  customer_id:
    type: string
    nullable: false
    pii: quasi_identifier
    llm_exposure: never
  country:
    type: string
    nullable: false
    pii: quasi_identifier
    llm_exposure: never
    enum:
    - MX
    - CO
    - AR
  segment:
    type: string
    nullable: false
    pii: sensitive
    llm_exposure: never
    enum:
    - Basic
    - Plus
    - Premium
    - Student
  customer_status:
    type: string
    nullable: false
    pii: sensitive
    llm_exposure: never
    enum:
    - Active
    - Inactive
    - Suspended
    - Closed
  _dataset_version:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
  _source_file:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
  _source_sha256:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
  _ingested_at:
    type: timestamp
    nullable: false
    pii: none
    llm_exposure: never
  _pipeline_version:
    type: string
    nullable: false
    pii: none
    llm_exposure: never
